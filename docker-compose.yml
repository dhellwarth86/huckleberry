version: "3.9"

services:
  postgres:
    image: postgres:16
    container_name: huckleberry-postgres
    environment:
      POSTGRES_USER: huckleberry
      POSTGRES_PASSWORD: huckleberry
      POSTGRES_DB: huckleberry
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U huckleberry"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Optional — only used if you chose MinIO as your S3 provider in PHASE_2_HANDOFF.md Section 1.1.
  # Activate with: docker compose --profile with-minio up -d
  minio:
    image: minio/minio
    container_name: huckleberry-minio
    profiles: ["with-minio"]
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: minio-dev-password-change-me
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    command: server /data --console-address ":9001"

volumes:
  postgres-data:
  minio-data:
